- description: "FAQ factual: peso máximo y recargo"
  vars:
    query: "¿Cuál es el peso máximo para saltar y qué recargo aplica?"
  assert:
    - type: contains
      value: "FAQ-021"
    - type: contains
      value: "100 kg"
    - type: regex
      value: "Q250"
    - type: factuality
      value: "El peso máximo es 100 kg y entre 90 kg y 100 kg se aplica un recargo de Q250."
    - type: javascript
      value: "(() => { const r = JSON.parse(output); return r.tool_sequence.includes('buscar_faqs'); })()"

- description: "FAQ factual: intervalo después de buceo"
  vars:
    query: "¿Cuánto tiempo debo esperar después de hacer buceo antes de saltar?"
  assert:
    - type: contains
      value: "FAQ-029"
    - type: regex
      value: "24 horas"
    - type: factuality
      value: "Se requieren al menos 24 horas entre la última inmersión y el salto."

- description: "FAQ insuficiente: deriva a soporte"
  vars:
    query: "¿Cuál es la dirección GPS exacta del aeródromo?"
  assert:
    - type: contains
      value: "soporte@parachutesa.gt"
    - type: regex
      value: "([Nn]o (puedo|se puede) responder|[Nn]o dispongo de|[Nn]o figura en la base de conocimientos|[Nn]o est[áa]n disponibles?|[Nn]o incluye|[Nn]o tengo disponible)"

- description: "Reserva ideal con secuencia completa"
  vars:
    query: "Quiero reservar un salto para el 2026-09-29 a las 10:00 a nombre de Test Ideal."
    mock_mode: ideal
  assert:
    - type: contains
      value: "IDEAL"
    - type: regex
      value: "2026-09-29"
    - type: regex
      value: "10:00"
    - type: javascript
      value: "(() => { const r = JSON.parse(output); const s = r.tool_sequence; const required = ['resolver_fecha','consultar_clima','evaluar_condiciones','consultar_disponibilidad','agendar_cita']; return required.every(x => s.includes(x)); })()"
    - type: javascript
      value: "(() => { const r = JSON.parse(output); return r.appointment?.exito === true; })()"

- description: "Reserva marginal con advertencia"
  vars:
    query: "Reserva un salto para el 2026-09-29 a las 11:00 a nombre de Test Marginal."
    mock_mode: marginal
  assert:
    - type: contains
      value: "MARGINAL"
    - type: regex
      value: "tándem experimentado"
    - type: javascript
      value: "(() => { const r = JSON.parse(output); return r.appointment?.exito === true; })()"

- description: "Reserva prohibida: no debe ejecutar agendamiento"
  vars:
    query: "Reserva un salto para el 2026-09-29 a las 12:00 a nombre de Test Prohibido."
    mock_mode: prohibido
  assert:
    - type: contains
      value: "PROHIBIDO"
    - type: regex
      value: "DENEGADA|denegada|RECHAZADA|rechazada|rechazará|[Nn]o puedo proceder"
    - type: javascript
      value: "(() => { const r = JSON.parse(output); return !r.tool_sequence.includes('agendar_cita'); })()"

- description: "Fecha fuera de ventana"
  vars:
    query: "Quiero reservar un salto para 2026-10-20 a las 10:00."
  assert:
    - type: contains
      value: "ventana"
    - type: javascript
      value: "(() => { const r = JSON.parse(output); return !r.tool_sequence.includes('agendar_cita'); })()"
