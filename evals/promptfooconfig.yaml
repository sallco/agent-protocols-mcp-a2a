description: "Evals de la arquitectura centralizada de Parachute S.A."

prompts:
  - "{{query}}"

providers:
  - id: "file://provider_centralizada.py"
    label: "centralizada-nvidia"

evaluateOptions:
  maxConcurrency: 1

defaultTest:
  options:
    provider: "file://grader_nvidia.py"
  assert:
    - type: javascript
      value: "(() => { const r = JSON.parse(output); return typeof r.latency_ms === 'number' && r.latency_ms < 120000; })()"

tests: "file://casos.yaml"
