[project]
name = "agent-protocols-mcp-a2a"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.0,<2",
    "httpx>=0.27.0",
    "mcp>=2.3.0,<3",
    "openai>=1.0.0",
    "openai-agents>=0.24.0,<1",
    "pgvector>=0.3.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "starlette>=1.8.0,<2",
    "uvicorn>=0.54.0,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]
